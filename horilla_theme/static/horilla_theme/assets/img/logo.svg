<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A4D65E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7AC943;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA328;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8BC34A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#689F38;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A7023;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#9FD356;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#558B2F;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Top row left trapezoid -->
  <polygon points="150,100 320,100 380,220 210,220" fill="url(#g1)" filter="url(#shadow)" />
  <!-- Top row middle trapezoid -->
  <polygon points="360,100 530,100 590,220 420,220" fill="url(#g2)" filter="url(#shadow)" />
  <!-- Top row right trapezoid -->
  <polygon points="570,100 740,100 670,220 500,220" fill="url(#g1)" filter="url(#shadow)" />

  <!-- Left vertical strip top -->
  <polygon points="50,210 210,210 280,330 120,330" fill="url(#g2)" filter="url(#shadow)" />
  <!-- Center vertical strip top -->
  <polygon points="300,210 460,210 530,330 370,330" fill="url(#g3)" filter="url(#shadow)" />
  <!-- Right vertical strip top -->
  <polygon points="550,210 710,750 620,330 460,330" fill="url(#g1)" filter="url(#shadow)" />

  <!-- Left vertical strip middle -->
  <polygon points="120,320 280,320 350,440 190,440" fill="url(#g1)" filter="url(#shadow)" />
  <!-- Center vertical strip middle -->
  <polygon points="370,320 530,320 600,440 440,440" fill="url(#g2)" filter="url(#shadow)" />
  <!-- Right vertical strip middle -->
  <polygon points="620,320 780,320 710,440 550,440" fill="url(#g3)" filter="url(#shadow)" />

  <!-- Left vertical strip bottom -->
  <polygon points="190,430 350,430 420,550 260,550" fill="url(#g3)" filter="url(#shadow)" />
  <!-- Center vertical strip bottom -->
  <polygon points="440,430 600,430 670,550 510,550" fill="url(#g1)" filter="url(#shadow)" />
  <!-- Right vertical strip bottom -->
  <polygon points="550,430 710,430 640,550 480,550" fill="url(#g2)" filter="url(#shadow)" />

  <!-- Bottom left diagonal -->
  <polygon points="100,540 260,540 330,660 170,660" fill="url(#g2)" filter="url(#shadow)" />
  <!-- Bottom center diagonal -->
  <polygon points="350,540 510,540 580,660 420,660" fill="url(#g3)" filter="url(#shadow)" />
  <!-- Bottom right diagonal -->
  <polygon points="600,540 760,540 690,660 530,660" fill="url(#g1)" filter="url(#shadow)" />

  <!-- Highlights for 3D effect -->
  <polygon points="150,100 200,140 180,160 140,130" fill="white" opacity="0.15" />
  <polygon points="360,100 410,140 390,160 350,130" fill="white" opacity="0.15" />
  <polygon points="570,100 620,140 600,160 560,130" fill="white" opacity="0.15" />
</svg>
