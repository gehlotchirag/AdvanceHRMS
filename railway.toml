# https://docs.railway.app/reference/config-as-code
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
buildCommand = null

[deploy]
preDeployCommand = "python manage.py migrate --noinput"
# Railway's startCommand replaces the image CMD; it must still run docker/entrypoint.sh or
# collectstatic never runs and STATIC_ROOT stays empty → 404 on all /static/ assets.
# Bind uses PORT via docker/gunicorn.conf.py (os.environ).
startCommand = "/entrypoint.sh gunicorn horilla.wsgi:application --config docker/gunicorn.conf.py"
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
